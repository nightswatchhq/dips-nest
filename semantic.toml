# tool, the admin UI, and the scaffolded skill. Edit descriptions freely; the
# `[table.*.footguns]` are DERIVED from the ABI and regenerated - leave them be.

schema_version = 1

[nest]
description = """
Direct Indexer Payments (DIPS) on Arbitrum One: the Issuance Allocator, the Recurring Agreement Manager and the Recurring Collector. As of 2026-08-28 the whole stack is deployed, wired and switched off: the allocator sends 100% of the 120.73 GRT/block to the Rewards Manager and 0 to DefaultAllocation, so GIP-0088's ~5% split is a governance parameter change away rather than a deployment away. Nearly every table here is empty on purpose. The table to watch is issuance_allocator__target_allocation_updated: the first row in it is the starting gun for DIPS-funded indexing.
"""

