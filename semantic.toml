[view]

# Authored views (views/*.sql) are described here so the MCP/`/schema` can render them:
# [view.your_view_name]
# description = "What this derivation computes."

[view.dips_timeline]
description = """
Every governance move that has configured DIPS on Arbitrum One, in order. The stack was switched on 2026-07-23 (issuance rate 0 -> 120.73 GRT/block, agreement manager wired to the allocator) and finished being wired on 2026-08-25 (collector pause guardian, provider-eligibility oracle, RewardsManager allocated the full 120.73, DefaultAllocation registered as the default target with zero). The next row in this view is the one that matters.
"""
grain = "one row per DIPS configuration event across all three contracts"

[view.dips_current_allocation]
description = """
The latest allocation per target: how much issuance each destination currently receives. DefaultAllocation (0x28cd50e9e02856908f4c1966ab035b1f6c4dde1e) is the indexing-agreement side and is at zero. The day it is not zero, DIPS is funding indexers.
"""
grain = "one row per allocation target, latest state"
